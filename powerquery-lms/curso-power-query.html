<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Query LMS</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col">

<header class="bg-slate-900 text-white h-16 flex items-center justify-between px-6 shadow-md shrink-0 border-b border-slate-800">
    <div class="flex items-center space-x-4">
        <div class="p-2 bg-emerald-500/10 rounded-lg border border-emerald-500/20">
            <i data-lucide="database" class="text-emerald-400 w-5 h-5"></i>
        </div>
        <div>
            <h1 class="text-sm font-bold text-slate-100 tracking-wide">Power Query LMS</h1>
            <p class="text-xs text-slate-400">Curso completo de Power Query en español</p>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <a href="index.html" class="text-xs text-slate-400 hover:text-white transition flex items-center gap-1.5">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Catálogo de cursos
        </a>
        <div class="flex items-center gap-2 border-l border-slate-800 pl-4">
            <span id="auth-user-name" class="text-xs text-slate-400"></span>
            <button onclick="logout()" class="text-xs text-slate-400 hover:text-white transition">Cerrar sesión</button>
        </div>
    </div>
</header>

<main class="flex-1 container mx-auto p-6 space-y-6">
    <div class="space-y-1">
        <h2 class="text-xl font-bold text-slate-900">Módulos del curso</h2>
        <p class="text-xs text-slate-600">Cada módulo incluye contenido teórico, video de tutoría, práctica con datos reales, evaluaciones y un sistema de insignias.</p>
    </div>

    <div id="modules-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
</main>

<footer class="pt-4 pb-4 text-[11px] text-slate-400 text-center">Power Query LMS &bull; 2026</footer>

<script src="assets/js/auth.js"></script>
<script>
requireAuth();
const authUser = getCurrentUser();
const authUserNameEl = document.getElementById('auth-user-name');
if (authUserNameEl && authUser) authUserNameEl.textContent = authUser.name;
</script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/course-modules.js"></script>
<script>
function renderModulesGrid() {
    const el = document.getElementById('modules-grid');
    el.innerHTML = COURSE_MODULES.map(m => {
        if (m.built) {
            return `<a href="modulos/${m.path}" class="block bg-white border border-slate-200 rounded-xl shadow-sm hover:bg-slate-50 transition p-5 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-extrabold shrink-0">${m.id}</span>
                    <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">${m.level}</span>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-slate-900">Módulo ${m.id}</h3>
                    <p class="text-xs text-slate-600 mt-1">${m.title}</p>
                </div>
                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <span class="text-[11px] text-slate-500">${m.lessons} lecciones</span>
                    <span class="text-xs font-semibold text-emerald-700 flex items-center gap-1">Comenzar <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></span>
                </div>
            </a>`;
        }
        return `<div class="block bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-3 opacity-70">
            <div class="flex items-center justify-between">
                <span class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-extrabold shrink-0">${m.id}</span>
                <span class="text-[10px] bg-slate-200 text-slate-500 font-bold px-2 py-0.5 rounded-full flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i> Próximamente</span>
            </div>
            <div>
                <h3 class="text-sm font-bold text-slate-700">Módulo ${m.id}</h3>
                <p class="text-xs text-slate-500 mt-1">${m.title}</p>
            </div>
            <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                <span class="text-[11px] text-slate-400">${m.lessons} lecciones</span>
            </div>
        </div>`;
    }).join('');
    safeIcons();
}
document.addEventListener('DOMContentLoaded', renderModulesGrid);
</script>
</body>
</html>
