<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Query LMS</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col">

<header class="bg-slate-900 text-white h-16 flex items-center justify-between px-6 shadow-md shrink-0 border-b border-slate-800">
    <div class="flex items-center space-x-4">
        <div class="p-2 bg-emerald-500/10 rounded-lg border border-emerald-500/20">
            <i data-lucide="database" class="text-emerald-400 w-5 h-5"></i>
        </div>
        <div>
            <h1 class="text-sm font-bold text-slate-100 tracking-wide">Academia Online</h1>
            <p class="text-xs text-slate-400">Catálogo de cursos</p>
        </div>
    </div>
    <div class="flex items-center gap-2 border-l border-slate-800 pl-4">
        <span id="auth-user-name" class="text-xs text-slate-400"></span>
        <button onclick="logout()" class="text-xs text-slate-400 hover:text-white transition">Cerrar sesión</button>
    </div>
</header>

<main class="flex-1 container mx-auto p-6 space-y-6">
    <div class="space-y-1">
        <h2 class="text-xl font-bold text-slate-900">Catálogo de cursos</h2>
        <p class="text-xs text-slate-600">Elige un curso para comenzar. Cada curso incluye contenido teórico, video de tutoría, práctica con datos reales, evaluaciones y un sistema de insignias.</p>
    </div>

    <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
</main>

<footer class="pt-4 pb-4 text-[11px] text-slate-400 text-center">Power Query LMS &bull; 2026</footer>

<script src="assets/js/auth.js"></script>
<script>
requireAuth();
const authUser = getCurrentUser();
const authUserNameEl = document.getElementById('auth-user-name');
if (authUserNameEl && authUser) authUserNameEl.textContent = authUser.name;
</script>
<script src="assets/js/icons.js"></script>
<script>
const COURSES_CATALOG = [
    { icon: "database", title: "Power Query", summary: "5 módulos · Nivel Básico a Intermedio", href: "curso-power-query.html", available: true },
    { icon: "file-spreadsheet", title: "Excel", summary: "Próximamente", href: null, available: false },
    { icon: "layout-panel-left", title: "Power BI", summary: "Próximamente", href: null, available: false },
];

function renderCoursesGrid() {
    const el = document.getElementById('courses-grid');
    el.innerHTML = COURSES_CATALOG.map(c => {
        if (c.available) {
            return `<a href="${c.href}" class="block bg-white border border-slate-200 rounded-xl shadow-sm hover:bg-slate-50 transition p-5 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center shrink-0"><i data-lucide="${c.icon}" class="w-4 h-4"></i></span>
                    <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">Disponible</span>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-slate-900">${c.title}</h3>
                    <p class="text-xs text-slate-600 mt-1">${c.summary}</p>
                </div>
                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <span class="text-xs font-semibold text-emerald-700 flex items-center gap-1">Comenzar <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></span>
                </div>
            </a>`;
        }
        return `<div class="block bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-3 opacity-70">
            <div class="flex items-center justify-between">
                <span class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center shrink-0"><i data-lucide="${c.icon}" class="w-4 h-4"></i></span>
                <span class="text-[10px] bg-slate-200 text-slate-500 font-bold px-2 py-0.5 rounded-full flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i> Próximamente</span>
            </div>
            <div>
                <h3 class="text-sm font-bold text-slate-700">${c.title}</h3>
                <p class="text-xs text-slate-500 mt-1">Sin lecciones disponibles todavía.</p>
            </div>
            <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                <span class="text-[11px] text-slate-400">&mdash;</span>
            </div>
        </div>`;
    }).join('');
    safeIcons();
}
document.addEventListener('DOMContentLoaded', renderCoursesGrid);
</script>
</body>
</html>
